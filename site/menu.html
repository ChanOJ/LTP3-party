<HEAD><script src="/frame-restore.js"></script>

<BASE target="content">
<SCRIPT Language="JavaScript"><!--
img_btn01 = new Image();
img_btn01.src='img/btn01a.gif';
img_btn02 = new Image();
img_btn02.src='img/btn02a.gif';
img_btn03 = new Image();

img_btn04 = new Image();

img_btn05 = new Image();
img_btn05.src='img/btn05a.gif';
img_btn06 = new Image();
img_btn06.src='img/btn06a.gif';

currentpage='';

function RollOn(img)
{
	eval("document.images.btn" + img + ".src='img/btn" + img + "a.gif'");
}

function RollOff(img)
{
	if (currentpage != img)
	{
		eval("document.images.btn" + img + ".src='img/btn" + img + ".gif'");
	}
}

function ChangeCurrentPage(img)
{
	currentpage = img;
	if (img != '01') document.images.btn01.src='img/btn01.gif';
	if (img != '02') document.images.btn02.src='img/btn02.gif';
	if (img != '03') document.images.btn03.src='img/btn03.gif';
	if (img != '04') document.images.btn04.src='img/btn04.gif';
	if (img != '05') document.images.btn05.src='img/btn05.gif';
	if (img != '06') document.images.btn06.src='img/btn06.gif';
}

// --></SCRIPT>
</HEAD>
<BODY background="img/fond.gif" bgcolor="#261422">
